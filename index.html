<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Уведомление для Гриши</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0d10;color:#f5f7fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,rgba(53,120,229,.18),transparent 35%),#0b0d10}
    main{width:min(680px,100%);border:1px solid #262b33;border-radius:22px;padding:28px;background:#13161b}
    .eyebrow{color:#8ea6c9;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    h1{font-size:clamp(28px,6vw,44px)}.hint{color:#aab2bd;line-height:1.55}
    label{display:block;margin:20px 0 8px;font-weight:700}
    textarea{width:100%;min-height:180px;resize:vertical;border:1px solid #343a45;border-radius:14px;padding:15px;background:#0e1116;color:#f5f7fa;font:inherit}
    button{width:100%;margin-top:16px;border:0;border-radius:14px;padding:15px;background:#f5f7fa;color:#0b0d10;font:inherit;font-weight:800;cursor:pointer}
    #status{min-height:24px;color:#aab2bd;font-size:14px}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ChatGPT → Vercel → Telegram</p>
    <h1>Уведомление для Гриши</h1>
    <p class="hint">Страница доступна через Vercel Deployment Protection. После отправки сообщение передаётся в Telegram Bot API.</p>
    <form action="/api/send" method="post" autocomplete="off" id="relay-form">
      <label for="text">Текст сообщения</label>
      <textarea id="text" name="text" maxlength="3500" required>✅ Тестовое уведомление от ChatGPT

Если ты это видишь в Telegram — схема ChatGPT → Vercel → Telegram работает.</textarea>
      <button id="send-button" type="submit">Отправить Грише в Telegram</button>
      <p id="status" aria-live="polite"></p>
    </form>
  </main>
  <script>
    const form = document.getElementById('relay-form');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('send-button');
      button.disabled = true;
      status.textContent = 'Отправка…';
      try {
        const response = await fetch(form.action, { method: 'POST', body: new FormData(form) });
        status.textContent = response.ok ? 'Сообщение принято Telegram.' : 'Не удалось отправить сообщение.';
      } catch {
        status.textContent = 'Ошибка соединения.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
